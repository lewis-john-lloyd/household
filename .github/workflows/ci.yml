name: ci

on:
  push:
  pull_request:

# CI only reads the code: its token can't push, tag or change settings
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # what Colab has run, and its current one
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python tools/leak_guard.py
      - run: python tools/import_guard.py
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m mypy
      - run: pytest -q

  end-to-end:
    # made-up inbox files through ingest and compute, then the built web app's page code on the Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: npm ci && npm run build
        working-directory: web
      - run: pytest -q -rs tests/test_end_to_end.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:server

  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - run: node --check exporter/Code.js
      - run: node --test exporter/test/exporter.test.js
      - run: node --check nudge/Code.js
      - run: node --test nudge/test/nudge.test.js
      - run: node --check assessor/Code.js
      - run: node --test assessor/test/assessor.test.js

  browser:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
