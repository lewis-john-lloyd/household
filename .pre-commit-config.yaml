repos:
  - repo: local
    hooks:
      - id: leak-guard
        name: leak guard
        entry: python tools/leak_guard.py
        language: system
        pass_filenames: true
      - id: import-guard
        name: import guard
        entry: python tools/import_guard.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
