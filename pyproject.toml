[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household"
version = "0.0.1"
description = "Ingest, compute and views for a household finance ledger kept in Google Sheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gspread>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
