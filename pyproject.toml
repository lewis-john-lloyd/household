[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household"
version = "0.5.0"
description = "Ingest, compute and views for a household finance ledger kept in Google Sheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gspread>=6",
    "pandas>=2",
    "google-api-python-client>=2",
    "pypdf==6.19.0",  # exact; an upgrade is a deliberate, reviewed change
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
