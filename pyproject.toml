[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household"
version = "0.54.0"
description = "Ingest, compute and views for a household finance ledger kept in Google Sheets."
readme = "README.md"
requires-python = ">=3.10"
# Colab supplies most of these; an upper bound keeps a release off a major version it was never
# tested with (pip installs the bound instead), and every run logs the versions it used (engine.versions)
dependencies = [
    "gspread>=6,<7",
    "pandas>=2,<4",  # tested on 2.x and 3.0
    "google-api-python-client>=2,<3",
    "pypdf==6.21.4",  # exact; an upgrade is a deliberate, reviewed change
    "scikit-learn>=1.3,<2",
    "scipy>=1.9,<2",  # already here with scikit-learn; the rebalance's linear program uses it directly
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5", "ruff>=0.17,<0.18", "mypy>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# real errors (pyflakes, syntax) and likely bugs (bugbear); zip(strict=) would only add noise here
select = ["F", "E9", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/household/parsers/__init__.py" = ["F401"]  # its imports are what the package offers

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
# gradual: only annotated functions are checked; the stage boundaries are annotated (tests/test_typed.py)
python_version = "3.10"
files = ["src/household"]
ignore_missing_imports = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
